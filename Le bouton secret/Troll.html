<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trolling</title>
<link rel="icon" href="icon.png"> 
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100vh;
    height:100dvh;
    background:#0a0a0a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage {
    position:relative;
    width:min(100vw, calc((100vh) * 1448 / 1086));
    width:min(100vw, calc((100dvh) * 1448 / 1086));
    overflow:hidden;
  }
  .stage img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }
  .hotspot {
    position:absolute;
    border-radius:50%;
    cursor:pointer;
    background:transparent;
    transform:translate(-50%,-50%);
    transition:box-shadow .15s ease, filter .15s ease;
  }
  .hotspot:hover {
    box-shadow:0 0 0 6px rgba(255,255,255,0.15);
  }
  .hotspot:active {
    filter:brightness(0.85);
  }

  .overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:1000;
  }
  .overlay.active {
    opacity:1;
    pointer-events:auto;
  }
  .overlay video {
    max-width:90vw;
    max-height:90vh;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
    border-radius:4px;
  }

  .help-btn {
    position:fixed;
    top:20px;
    right:20px;
    width:48px;
    height:48px;
    border-radius:50%;
    background:#2c2c2c;
    color:#fff;
    border:2px solid #555;
    font-size:22px;
    font-weight:bold;
    font-family:Arial, sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:900;
    transition:background .15s ease, transform .15s ease;
  }
  .help-btn:hover {
    background:#444;
    transform:scale(1.05);
  }

  .help-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:1100;
  }
  .help-overlay.active {
    opacity:1;
    pointer-events:auto;
  }
  .help-overlay img {
    max-width:90vw;
    max-height:90vh;
    border-radius:6px;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
  }
.outro {
  color: red;
  font-weight: normal;
  font-style: italic;
  background-color: yellow;
  }
footer {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 2000;
  }
</style>
</head>
<body>

  <div class="stage">
    <img src="buttons troll.png" alt="">

    <!-- Seul le bouton troll face est cliquable -->
    <div class="hotspot" data-video="videos/Troll.mp4"
         style="left:35.45%; top:65.15%; width:22%; height:30%;"></div>
  </div>

  <div class="overlay" id="overlay">
    <video id="player" playsinline></video>
  </div>
<footer>
  <span class="outro" align="center">
    &copy; <span id="copyright">Copyright</span> Reserved<br>
    Site appartenant au Clown🗿<br>
    Aller sur la page principale : <a href="https://clownenmetal.github.io" style="color:red;text-decoration:none;">ICI</a>
  </span>
  </footer>
<script>
  const overlay = document.getElementById('overlay');
  const player = document.getElementById('player');
  let closeTimeout = null;

  function clearPendingClose() {
    if (closeTimeout) {
      clearTimeout(closeTimeout);
      closeTimeout = null;
    }
  }

  function playVideo(src) {
    clearPendingClose();
    player.pause();
    player.src = src;
    player.currentTime = 0;
    overlay.classList.add('active');
    player.play();
  }

  document.querySelectorAll('.hotspot').forEach(btn => {
    btn.addEventListener('click', () => {
      playVideo(btn.getAttribute('data-video'));
    });
  });

  player.addEventListener('ended', () => {
    // reste sur la dernière frame pendant 1 secondes avant de disparaître
    closeTimeout = setTimeout(() => {
      overlay.classList.remove('active');
      player.removeAttribute('src');
      player.load();
      closeTimeout = null;
    }, 1000);
  });

  // Cliquer en dehors de la vidéo l'arrête aussi (ferme immédiatement)
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) {
      clearPendingClose();
      player.pause();
      overlay.classList.remove('active');
      player.removeAttribute('src');
      player.load();
    }
  });

</script>

</body>
</html>
