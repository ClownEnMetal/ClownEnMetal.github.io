<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trolling</title>
<link rel="icon" href="icon.png"> 
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100vh;
    height:100dvh;
    background:#0a0a0a;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-family:Arial, sans-serif;
  }

  footer {
    font-family: initial;
  }
  .stage {
    position:relative;
    width:min(100vw, calc((100vh) * 1448 / 1086));
    width:min(100vw, calc((100dvh) * 1448 / 1086));
    overflow:hidden;
  }
 .stage img {
    display:block;
    width:100%;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
  }

  .question-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.75);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    z-index:1000;
    transition:opacity .3s ease;
  }
  .question-overlay.hidden {
    opacity:0;
    pointer-events:none;
  }
  .question-overlay h1 {
    color:#fff;
    font-size:clamp(24px, 5vw, 52px);
    max-width:900px;
    margin-bottom:40px;
    text-shadow:0 0 20px rgba(0,0,0,0.9);
    letter-spacing:1px;
  }
  .choices {
    display:flex;
    gap:30px;
  }
  .choice-btn {
    font-size:clamp(20px, 3vw, 32px);
    font-weight:bold;
    padding:18px 60px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, filter .15s ease;
  }
  .choice-btn:hover {
    transform:scale(1.08);
    filter:brightness(1.1);
  }
  .choice-btn.oui {
    background:#c0392b;
    color:#fff;
  }
  .choice-btn.non {
    background:#2c7a3f;
    color:#fff;
  }

  .video-overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.95);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:1100;
  }
  .video-overlay.active {
    opacity:1;
    pointer-events:auto;
  }
  .video-overlay video {
    max-width:90vw;
    max-height:90vh;
    box-shadow:0 0 60px rgba(0,0,0,0.6);
    border-radius:4px;
  }
  .outro {
  color: red;
  font-weight: normal;
  font-style: italic;
  background-color: yellow;
  }
footer {
  position: fixed;
  bottom: 8px;
  left: 8px;
  z-index: 2000;
  }
</style>
</head>
<body>

  <div class="stage">
    <img src="Bouton caché.png" alt="">
  </div>

  <div class="question-overlay" id="questionOverlay">
    <h1>VEUX-TU APPUYER SUR LE BOUTON TROLLING CRUEL ?</h1>
    <div class="choices">
      <a href="Troll.html"><button class="choice-btn oui" id="btnOui">OUI</button></a>
      <button class="choice-btn non" id="btnNon">NON</button>
    </div>
  </div>

  <div class="video-overlay" id="videoOverlay">
    <video id="player" playsinline></video>
  </div>
<footer>
  <span class="outro" align="center">
    &copy; Copyright Reserved<br>
    Site appartenant au Clown🗿<br>
    Aller sur la page principale : <a href="https://clownenmetal.github.io" style="color:red;text-decoration:none;">ICI</a>
  </span>
  </footer>
<script>
  const questionOverlay = document.getElementById('questionOverlay');
  const videoOverlay = document.getElementById('videoOverlay');
  const player = document.getElementById('player');

  function playVideo(src) {
    questionOverlay.classList.add('hidden');
    player.pause();
    player.src = src;
    player.currentTime = 0;
    videoOverlay.classList.add('active');
    player.play();
  }

  document.getElementById('btnNon').addEventListener('click', () => {
    playVideo('videos/Ange.mp4');
  });

  player.addEventListener('ended', () => {
    videoOverlay.classList.remove('active');
    player.removeAttribute('src');
    player.load();
  });
</script>

</body>
</html>
